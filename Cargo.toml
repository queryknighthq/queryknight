[workspace]
resolver = "2"
members = [
    "crates/qk-core",
    "crates/qk-compat",
    "crates/qk-sql",
    "crates/qk-approval",
    "crates/qk-cli",
    "crates/qk-db",
    "crates/qk-store",
    "crates/qk-daemon",
    "crates/qk-mcp",
    "crates/qk-metrics",
    "crates/qk-audit",
    "crates/qk-control-plane",
    "crates/qk-proxy-postgres",
    "crates/qk-proxy-mysql",
    "crates/qk-openshell",
]

[workspace.package]
# One product version for every QueryKnight crate. Protocol and format
# versions (policy schema, approval digest, OCSF, OpenShell extension) are
# separate and deliberately not derived from this.
version = "0.1.0"
