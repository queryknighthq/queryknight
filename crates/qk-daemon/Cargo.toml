[package]
name = "qk-daemon"
version = "0.1.0-beta.0"
edition = "2021"

[dependencies]
qk-core = { path = "../qk-core" }
qk-approval = { path = "../qk-approval" }
qk-store = { path = "../qk-store" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tower = { version = "0.5", features = ["timeout", "util"] }
tower-http = { version = "0.6", features = ["limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
