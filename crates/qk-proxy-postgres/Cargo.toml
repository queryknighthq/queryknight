[package]
name = "qk-proxy-postgres"
version.workspace = true
edition = "2021"

[dependencies]
qk-approval = { path = "../qk-approval" }
qk-core = { path = "../qk-core" }
qk-control-plane = { path = "../qk-control-plane" }
qk-db = { path = "../qk-db" }
bytes = "1"
qk-sql = { path = "../qk-sql" }
tokio = { version = "1", features = ["macros", "rt", "net", "time", "sync", "io-util", "signal"] }
tokio-postgres = "0.7"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging", "tls12"] }

[dev-dependencies]
qk-daemon = { path = "../qk-daemon" }
qk-store = { path = "../qk-store" }
serde_json = "1"
tokio-postgres = "0.7"
