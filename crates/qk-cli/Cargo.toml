[package]
name = "qk-cli"
version = "0.1.0-beta.0"
edition = "2021"

[[bin]]
name = "queryknight"
path = "src/main.rs"

[dependencies]
qk-core = { path = "../qk-core" }
qk-sql = { path = "../qk-sql" }
qk-daemon = { path = "../qk-daemon" }
qk-mcp = { path = "../qk-mcp" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync", "io-util"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
