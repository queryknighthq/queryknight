[package]
name = "qk-cli"
version = "0.1.0-beta.0"
edition = "2021"

[[bin]]
name = "queryknight"
path = "src/main.rs"

[dependencies]
qk-core = { path = "../qk-core" }
qk-sql = { path = "../qk-sql" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
