[package]
name = "qk-proxy-mysql"
version = "0.1.0-beta.0"
edition = "2021"

[dependencies]
qk-approval = { path = "../qk-approval" }
qk-control-plane = { path = "../qk-control-plane" }
qk-core = { path = "../qk-core" }
qk-db = { path = "../qk-db" }
qk-sql = { path = "../qk-sql" }
mysql_async = "0.37"
tokio = { version = "1", features = ["macros", "rt", "net", "time", "sync", "io-util", "signal"] }

[dev-dependencies]
qk-daemon = { path = "../qk-daemon" }
qk-store = { path = "../qk-store" }
qk-mcp = { path = "../qk-mcp" }
mysql_async = "0.37"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util"] }
sha2 = "0.10"
sha1 = "0.10"
