[package]
name = "qk-control-plane"
version.workspace = true
edition = "2021"

[dependencies]
qk-approval = { path = "../qk-approval" }
qk-core = { path = "../qk-core" }
qk-daemon = { path = "../qk-daemon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util"] }
qk-sql = { path = "../qk-sql" }
