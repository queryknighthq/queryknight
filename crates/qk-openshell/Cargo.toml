[package]
name = "qk-openshell"
version.workspace = true
license.workspace = true
edition = "2021"
build = "build.rs"

[dependencies]
async-stream = "0.3"
http = "1"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
qk-control-plane = { path = "../qk-control-plane" }
qk-audit = { path = "../qk-audit" }
futures-core = "0.3"
prost = "0.14"
prost-types = "0.14"
qk-approval = { path = "../qk-approval" }
qk-core = { path = "../qk-core" }
qk-db = { path = "../qk-db" }
qk-sql = { path = "../qk-sql" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14.6", features = ["transport", "tls-ring"] }
rustls-pemfile = "2"
tonic-prost = "0.14.6"
tower = "0.5"
x509-parser = "0.16"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
base64 = "0.22"
qk-daemon = { path = "../qk-daemon" }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
