[package]
name = "qk-openshell"
version = "0.1.0-beta.0"
edition = "2021"
build = "build.rs"

[dependencies]
async-stream = "0.3"
qk-control-plane = { path = "../qk-control-plane" }
qk-audit = { path = "../qk-audit" }
futures-core = "0.3"
prost = "0.14"
prost-types = "0.14"
qk-approval = { path = "../qk-approval" }
qk-core = { path = "../qk-core" }
qk-db = { path = "../qk-db" }
qk-sql = { path = "../qk-sql" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
qk-daemon = { path = "../qk-daemon" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
